# Supabase project configuration for ZEWJOUNA.
# Link with:  supabase link --project-ref yahkxceolwolgglllcbt
project_id = "yahkxceolwolgglllcbt"

[db]
major_version = 15

[auth]
# Email/password onboarding. Add OAuth providers here when needed.
enable_signup = true

[storage]
enabled = true

# The signed-photo-urls function runs authenticated callers only; it verifies
# the JWT itself and uses the service-role key to sign private photos.
[functions.signed-photo-urls]
verify_jwt = true

# delete-account deletes the caller's own auth.users row (RGPD erasure),
# cascading to all their data. JWT-gated; uses the service-role key server-side.
[functions.delete-account]
verify_jwt = true
